<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family: Georgia, "Times New Roman", serif;
        background:
            linear-gradient(
                135deg,
                #dceff0 0%,
                #d8eaf3 45%,
                #dcecdf 100%
            );
        color: #315c63;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* The whole little scene */

    .scene {
        position: relative;
        width: 100%;
        min-height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Glassy message */

    .message {
        position: relative;
        z-index: 3;

        width: min(82%, 720px);
        min-height: 125px;

        padding: 30px 50px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.58),
                rgba(235,250,248,0.38)
            );

        border: 1px solid rgba(255,255,255,0.7);

        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(65, 115, 120, 0.12),
            inset 0 1px 2px rgba(255,255,255,0.8);

        backdrop-filter: blur(8px);

        animation: appear 0.8s ease-out;
    }

    #quote {
        font-size: clamp(17px, 2.15vw, 25px);
        line-height: 1.55;
        font-style: italic;
        letter-spacing: 0.01em;
        max-width: 650px;
    }

    /* Little bottle-neck suggestion */

    .message::before {
        content: "";
        position: absolute;

        width: 32px;
        height: 13px;

        top: -7px;
        left: 50%;

        transform: translateX(-50%);

        background: rgba(240,255,252,0.62);

        border: 1px solid rgba(255,255,255,0.7);

        border-bottom: none;

        border-radius: 8px 8px 0 0;
    }

    /* Bubbles */

    .bubble {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.55);
        background: rgba(255,255,255,0.18);
        animation: float 7s ease-in-out infinite;
    }

    .bubble-one {
        width: 13px;
        height: 13px;
        left: 11%;
        bottom: 18px;
        animation-delay: -2s;
    }

    .bubble-two {
        width: 8px;
        height: 8px;
        left: 22%;
        top: 22px;
        animation-delay: -4s;
    }

    .bubble-three {
        width: 17px;
        height: 17px;
        right: 14%;
        bottom: 25px;
        animation-delay: -1s;
    }

    .bubble-four {
        width: 7px;
        height: 7px;
        right: 25%;
        top: 30px;
        animation-delay: -5s;
    }

    .bubble-five {
        width: 10px;
        height: 10px;
        left: 6%;
        top: 65px;
        animation-delay: -3s;
    }

    /* Very subtle waves */

    .wave {
        position: absolute;
        width: 120%;
        height: 45px;

        border-top: 1px solid rgba(88,145,148,0.12);
        border-radius: 50%;

        left: -10%;
    }

    .wave-one {
        bottom: 10px;
        transform: rotate(-2deg);
    }

    .wave-two {
        bottom: -4px;
        transform: rotate(2deg);
    }

    /* Gentle floating animation */

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.45;
        }

        50% {
            transform: translateY(-18px);
            opacity: 0.8;
        }
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(7px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="scene">

    <div class="wave wave-one"></div>
    <div class="wave wave-two"></div>

    <div class="bubble bubble-one"></div>
    <div class="bubble bubble-two"></div>
    <div class="bubble bubble-three"></div>
    <div class="bubble bubble-four"></div>
    <div class="bubble bubble-five"></div>

    <div class="message">
        <div id="quote"></div>
    </div>

</div>

<script>

const quotes = [

    "everything I've ever let go of has claw marks on it",

    "true love ought to have enough salt in it to float you. you shouldn't have to be underwater",

    "it takes strength to be gentle and kind",

    "do not go gentle into that good night",

    "you cannot kill me in a way that matters",

    "it is better to show up than to give up",

    "all of my life, a voice has whispered softly in my ear: \"live, live, live.\" it was death",

    "everything sings",

    "to love and be loved in return",

    "cathedrals are everywhere for those with eyes to see",

    "there is no moral. The wolf eats you one day, and, until it does, the forest is beautiful",

    "you do not have to be good",

    "no one is coming to save you. get up.",

    "death wants me to live",

    "the person in love always wins",

    "everything means what you think it does",

    "if it's meant to be, it will be",

    "i am not afraid to walk this world alone",

    "do it alone",

    "it seems unforgiving when a good thing ends, but you and I will always be back then",

    "when the power of love beats the love of power, the world will know peace",

    "everything will work out because i am insane",

    "sometimes life is scary and dark. that is why we must find the light",

    "if you get everything you want the minute you want it, whats the point of living?",

    "as long as i know the shape of my soul, i'll be alright",

    "and now that you don't have to be perfect, you can be good.",

    "nothing behind me, everything ahead of me, as is ever so on the road.",

    "\"hope\" is the thing with feathers that perches in the soul.",

    "there is a crack in everything. that's how the light gets in."

];


/* Choose one quote whenever the page loads */

const randomQuote =
    quotes[Math.floor(Math.random() * quotes.length)];


/* Display it */

document.getElementById("quote").textContent =
    "“" + randomQuote + "”";

</script>

</body>
</html>
